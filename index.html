<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generative ASCII Art</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="canvas">
  <pre id="art"></pre>
</div>

<div id="panel">
  <h1>ASCII Art</h1>

  <div class="group">
    <label>패턴 <span id="v-pattern">sine</span></label>
    <input type="range" id="pattern" min="0" max="5" step="1" value="0">
  </div>

  <div class="group">
    <label>주파수 <span id="v-freq">3</span></label>
    <input type="range" id="freq" min="1" max="20" step="0.5" value="3">
  </div>

  <div class="group">
    <label>속도 <span id="v-speed">1</span></label>
    <input type="range" id="speed" min="0" max="5" step="0.1" value="1">
  </div>

  <div class="group">
    <label>밀도 <span id="v-density">5</span></label>
    <input type="range" id="density" min="1" max="10" step="1" value="5">
  </div>

  <div class="group">
    <label>글자 세트 <span id="v-chars">blocks</span></label>
    <input type="range" id="chars" min="0" max="4" step="1" value="0">
  </div>

  <div class="group">
    <label>마우스 영향 <span id="v-mouse">30</span></label>
    <input type="range" id="mouse" min="0" max="100" step="1" value="30">
  </div>

  <div class="divider"></div>

  <div class="group">
    <label>색상 팔레트</label>
    <div class="palette" id="palette"></div>
  </div>

  <div class="divider"></div>

  <div class="group">
    <label>프리셋</label>
    <div class="presets">
      <button data-preset="matrix">▶ 매트릭스</button>
      <button data-preset="ocean">▶ 파도</button>
      <button data-preset="fire">▶ 불꽃</button>
      <button data-preset="cosmos">▶ 우주</button>
      <button data-preset="glitch">▶ 글리치</button>
    </div>
  </div>

  <button id="save-btn">💾 PNG 저장</button>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
